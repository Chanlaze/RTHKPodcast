<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>古今風雲人物 Podcast Feed</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2933;
      background: #f7f8f8;
    }

    main {
      width: min(680px, calc(100vw - 32px));
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.25;
    }

    p {
      margin: 0 0 18px;
      line-height: 1.65;
    }

    a {
      color: #0f766e;
      font-weight: 700;
    }

    code {
      display: block;
      padding: 14px;
      overflow-wrap: anywhere;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>古今風雲人物 People In History</h1>
    <p>Podcast RSS feed for iPhone Podcasts:</p>
    <p><a href="people-in-history.xml">people-in-history.xml</a></p>
    <code id="feed-url"></code>
  </main>
  <script>
    document.getElementById("feed-url").textContent =
      new URL("people-in-history.xml", window.location.href).href;
  </script>
</body>
</html>
